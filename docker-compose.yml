# Ambiente de desenvolvimento 100% containerizado, com hot-reload via volume
# (`.specs/codebase/ARCHITECTURE.md` § Containerização).
#
# Os valores de `environment` abaixo são SINTÉTICOS, apenas para dev.
# Em produção eles vêm do ambiente de deploy — ver `.env.example`.

services:
  checkout:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173' # Vite (SPA em dev)
      - '3000:3000' # BFF Fastify
    environment:
      NODE_ENV: development
      PORT: '3000'
      baseDomain: ${baseDomain:-apps.example.test}
      ENTRADA_AES_KEY: ${ENTRADA_AES_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      ENTRADA_AES_IV: ${ENTRADA_AES_IV:-f0e1d2c3b4a5968778695a4b3c2d1e0f}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me-0123456789}
      ERP_PROTOCOL: ${ERP_PROTOCOL:-https}
      # APENAS DEV: aponta o BFF para um ERP mockado, já que `<tenant>.<baseDomain>`
      # não resolve num ambiente local. MUST ficar vazio em produção.
      ERP_HOST_OVERRIDE: ${ERP_HOST_OVERRIDE:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
