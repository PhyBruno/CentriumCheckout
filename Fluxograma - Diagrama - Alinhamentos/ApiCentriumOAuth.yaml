                  Empresa:
                    type: integer
                  CodCliente:
                    type: integer
                  nome:
                    type: string
                  cpf:
                    type: string
                  email:
                    type: string  
                  celular:
                    type: string 
                  cep:
                    type: string
                  endereco:
                    type: string
                  bairro:
                    type: string
                  numero:
                    type: string
                  cidade:
                    type: string
                  uf:
                    type: string
  
  /ApiCentriumOAuth/GetListaProdutos:
    get:
      summary: Retorna a lista de produtos disponíveis
      description: Endpoint para obter a lista completa de produtos cadastrados no sistema.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: header
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1
        - name: TxtBusca
          in: query
          required: false
          description: Texto para filtrar os produtos pelo nome ou descrição.
          schema:
            type: string
            example: "produto_exemplo"
        - name: Pagina
          in: query
          required: false
          description: Número da página para paginação dos resultados.
          schema:
            type: integer
            example: 1
        - name : TamanhoPagina
          in: query
          required: false
          description: Quantidade de produtos por página. Maximo 50.
          schema:
            type: integer
            example: 10

      responses:
        '200':
          description: Lista de produtos obtida com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  PaginaAtual:
                    type: integer
                  RegistrosPorPagina:
                    type: integer
                  TotalRegistros:
                    type: integer
                  TotalPaginas:
                    type: integer
                  produtos:
                    type: array
                    items:
                      type: object
                      properties:
                        CodigoProduto:
                          type: string
                        Descricao:
                          type: string
                        Referencia:
                          type: string
                        CodigoBarras:
                          type: string
                        PrecoVenda1:
                          type: number
                        PrecoVenda2:
                          type: number
                        PrecoVenda3:
                          type: number
                        PrecoVenda4:
                          type: number
                        PrecoVenda5:  
                          type: number
                        Estoque:
                          type: number
                        CodigoGrupo:
                          type: integer
                        DescricaoGrupo:
                          type: string
                        CodigoSubgrupo:
                          type: integer
                        DescricaoSubgrupo:
                          type: string
                        Aplicacao:
                          type: string
                        GTINTributavel:
                          type: string
                        QtdMinimaPreco2:
                          type: integer
                        QtdMinimaPreco3:
                          type: integer
                        QtdMinimaPreco4:
                          type: integer
                        QtdMinimaPreco5:
                          type: integer
                        UDM:
                          type: string

  /ApiCentriumOAuth/GetProduto:
    get:
      summary: Retorna os detalhes de um produto específico
      description: Endpoint para obter os detalhes completos de um produto cadastrado no sistema.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: query
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1
        - name: CodigoProduto
          in: query
          required: true
          description: Código do produto a ser consultado.
          schema:
            type: string
            example: "12345"
        - name: TipoCodProduto
          in: query
          required: true
          description: Tipo de código do produto a ser consultado ex CodigoProduto, CodigoBarras, Referencia.
          schema:
            type: string
            example: "CodigoProduto"
        - name: TipoPreco
          in: query
          required: true
          description: Tipo de preço a ser consultado.
          schema:
            type: integer
            example: 1
        - name: CodCliente
          in: query
          required: false
          description: Código do cliente para consulta de preço específico.
          schema:
            type: integer
            example: 123
        - name: ListaPreco
          in: query
          required: true
          description: Lista de preço a ser consultada.
          schema:
            type: integer
            example: 1


      responses:
        '200':
          description: Detalhes do produto obtidos com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  CodigoProduto:
                    type: string
                  Descricao:
                    type: string
                  Referencia:
                    type: string
                  CodigoBarras:
                    type: string
                  PrecoVenda1:
                    type: number
                  PrecoVenda2:
                    type: number
                  PrecoVenda3:
                    type: number
                  PrecoVenda4:
                    type: number
                  PrecoVenda5:  
                    type: number
                  PrecoMinimo:
                    type: number
                  Estoque:
                    type: number
                  CodigoGrupo:
                    type: integer
                  DescricaoGrupo:
                    type: string
                  CodigoSubgrupo:
                    type: integer
                  DescricaoSubgrupo:
                    type: string
                  Aplicacao:
                    type: string
                  GTINTributavel:
                    type: string
                  QtdMinimaPreco2:
                    type: integer
                  QtdMinimaPreco3:
                    type: integer
                  QtdMinimaPreco4:
                    type: integer
                  QtdMinimaPreco5:
                    type: integer
                  UDM:

  /ApiCentriumOAuth/ValidaTicketDevolucao:
    post:
      summary: Validar ticket de devolução
      description: Endpoint para validar um ticket de devolução.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: query
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketDevolucao:
                  type: string
                  example: "123456789"
      responses:
        '200':
          description: Ticket de devolução validado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  valido:
                    type: boolean
                  mensagem:
                    type: string  
  
  /ApiCentriumOAuth/FaturarNFCe:
    post:
      summary: Faturar NFCe
      description: Endpoint para faturar uma Nota Fiscal de Consumidor Eletrônica (NFCe).
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Empresa:
                  type: integer
                SuspenderOuFaturar:
                  type: string
                clienteCodigo:
                  type: integer
                vendedorCodigo:
                  type: integer
                CondicaoPagamentoCodigo:
                  type: integer
                NumeroNota:
                  type: integer
                CadSerieNFCe:
                  type: string
                UsuarioCodigo:
                  type: integer
                FormasDePagamento:
                  type: array
                  items:
                    type: object
                    properties:
                      FormaCodigo:
                        type: integer
                      FormaMeioPagtoNFe:
                        type: string
                      FormaValor:
                        type: number
                      FormaIntegracaoCartao:
                        type: string
                      TEFidentificacao:
                        type: integer
                      TEFCNPJ:
                        type: string
                      TEFBandeira:
                        type: string
                      TEFNumeroAutorizacao:
                        type: string
                      TEFTipoIntegracao:
                        type: string
                      FormaPixGUID:
                        type: string
                      TicketDevolucao:
                        type: string
                produtos:
                  type: array
                  items:
                    type: object
                    properties:
                      sequencial:
                        type: integer
                      codigoProduto:
                        type: string
                      quantidade:
                        type: number
                      precoUnitario:
                        type: number
                      DescontoPercentual:
                        type: number
                      DescontoValor:
                        type: number
                      ValorBruto:
                        type: number
                      UDM:
                        type: string
      responses:
        '200':
          description: NFCe faturada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  numeroNFCe:
                    type: string
                  chaveAcesso:
                    type: string
                  dataEmissao:
                    type: string
                  XMLImpressao:
                    type: string
                  CodigoRejeicao:
                    type: string
                  MensagemRejeicao:
                    type: string

  /ApiCentriumOAuth/CarregarNFCe:
    get:
      summary: Carregar NFCe
      description: Endpoint para carregar uma Nota Fiscal de Consumidor Eletrônica (NFCe) existente.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: query
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1
        - name: NumeroNota
          in: query
          required: true
          description: Código da Nota.
          schema:
            type: integer
            example: 1
        - name: SerieNota
          in: query
          required: true
          description: Código da série.
          schema:
            type: string
            example: "R01"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NumeroNFCe:
                  type: string
                  example: "12345678901234567890123456789012345678901234"
                SerieNFCe:
                  type: string
                  example: "1"
      responses:
        '200':
          description: NFCe carregada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  dadosNFCe:
                    type: object
                    properties:
                      SuspenderOuFaturar:
                        type: string
                      clienteCodigo:
                        type: integer
                      vendedorCodigo:
                        type: integer
                      CondicaoPagamentoCodigo:
                        type: integer
                      CadSerieNFCe:
                        type: string
                      FormasDePagamento:
                        type: array
                        items:
                          type: object
                          properties:
                            FormaCodigo:
                              type: integer
                            FormaMeioPagtoNFe:
                              type: string
                            FormaValor:
                              type: number
                            FormaIntegracaoCartao:
                              type: string
                            TEFidentificacao:
                              type: string
                            TEFCNPJ:
                              type: string
                            TEFBandeira:
                              type: string
                            TEFNumeroAutorizacao:
                              type: string
                            FormaPixGUID:
                              type: string
                      produtos:
                        type: array
                        items:
                          type: object
                          properties:
                            sequencial:
                              type: integer
                            codigoProduto:
                              type: string
                            quantidade:
                              type: number
                            precoUnitario:
                              type: number
                            DescontoPercentual:
                              type: number
                            DescontoValor:
                              type: number
                            ValorBruto:
                              type: number
                            UDM:
                              type: string

