        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
   
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Empresa:
                  type: integer
                nome:
                  type: string
                cpf:
                  type: string
                email:
                  type: string
                celular:
                  type: string
                cep:
                  type: string
                endereco:
                  type: string
                bairro:
                  type: string
                numero:
                  type: string
                cidade:
                  type: string
                uf:
                  type: string
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
