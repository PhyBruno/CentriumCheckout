  /ApiCentriumOAuth/GetStatusSistema:
    get:
      summary: Retorna o status do sistema
      description: Endpoint para verificar o status atual do sistema.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: header
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1

      responses:
        '200':
          description: Status do sistema obtido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  mensagem:
                    type: string

  /ApiCentriumOAuth/GetPDFNota:
    get:
      summary: Retorna o PDF de uma nota fiscal
      description: Endpoint para obter o PDF de uma nota fiscal específica.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: query
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1
        - name: NumeroNota
          in: query
          required: true
          description: Código da Nota.
          schema:
            type: integer
            example: 1
        - name: SerieNota
          in: query
          required: true
          description: Código da série.
          schema:
            type: string
            example: "R01"

      responses:
        '200':
          description: PDF da nota fiscal obtido com sucesso
          content:
            application/pdf:
              schema:
                type: string
                format: base64

  /ApiCentriumOAuth/GerarPIX:
    post:
      summary: Gerar PIX
      description: Endpoint para gerar um pagamento via PIX.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Empresa:
                  type: integer
                  example: 123
                TrnValor:
                  type: number
                  example: 100.00
                TrnPagadorNome:
                  type: string
                  example: "Nome do Pagador"
                TrnPagadorCgc:
                  type: string
                  example: "12345678901"
                TrnPagadorEmail:
                  type: string
                  example: "pagador@exemplo.com"
                TrnPagadorFone:
                  type: string
                  example: "11999999999"
                TrnOrigemDocumento:
                  type: string
                  example: "Documento de Origem"
                TrnOrigemSerie:
                  type: string
                  example: "Série de Origem"
                FPgCod:
                  type: integer
                  example: 1
                TrnTempoExpiracaoPIX:
                  type: integer
                  example: 3600
      responses:
        '200':
          description: PIX gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  TrnGUID:
                    type: string
                  Trnbase64text:
                    type: string




