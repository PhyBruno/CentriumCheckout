openapi: 3.0.3

info:
  title: API de Clientes
  version: 1.0.0

paths:
  /oauth/access_token:
    post:
      summary: Obter token de acesso
      description: Endpoint para obter um token de acesso válido para autenticação.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  example: "seu_client_id"
                client_secret:
                  type: string
                  example: "seu_client_secret"
                grant_type:
                  type: string
                  example: "password"
                scope:
                  type: string
                  example: "FullControl"
                username:
                  type: string
                  example: "usuario_exemplo"
                password:
                  type: string
                additionalParameters:
                  type: string
                  example: '{"AuthenticationTypeName":"local","Repository":"13cdc799-9969-414b-9424-ec75b5ce2646"}'
      responses:
        '200':
          description: Token de acesso obtido com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  scope:
                    type: string
                  user_guid:
                    type: string

  /ApiCentriumOAuth/GetSessao:
    get:
      summary: Retorna dados da sessão do usuário autenticado
      description: Retorna informações detalhadas sobre a sessão do usuário autenticado.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: header
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1
        - name: Login
          in: query
          required: true
          description: Identificador exclusivo do usuário.
          schema:
            type: string
            example: "12345678900"       

      responses:
        '200':
          description: Usuário localizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  UsuarioCodigo:
                    type: integer
                  UsuarioNome:
                    type: string
                  caixa:
                    type: integer
                  EmpresaRazaoSocial:
                    type: string  
                  EmpresaNomeFantasia:
                    type: string 
                  VendedorCodigo:
                    type: integer
                  VendedorNome:
                    type: string
                  ClienteDefaultCodigo:
                    type: integer
                  ClienteDefaultNome:
                    type: string
                  UsuarioTipoCodigoProduto:
                    type: string
                  Cliente_UtilizaSegundoNivelDeEnderecos:
                    type: string
                  CadMaqCod:
                    type: string
                  CadMaqHost:
                    type: string  
                  CadSerieNFCe:
                    type: string
                  QtdMinCharParaConsulta:
                    type: integer
                  ImagemLogoBase64:
                    type: string
                  ImagemDisplaySecundarioBase64:
                    type: string
                  TipoPreco:
                    type: integer
                  CondicoesDePagamento:
                    type: array
                    items:
                      type: object
                      properties:
                        CondicaoCodigo:
                          type: integer
                        CondicaoDescricao:
                          type: string
                        CondicaoPrazo:
                          type: integer
                        CondicaoMinimoEntrada:
                          type: number
                        CondicaoDesconto:
                          type: number
                        CondicaoDescontoMaximo:
                          type: number
                        CondicaoFormasDePagamento:
                          type: array
                          items:
                            type: object
                            properties:
                              FormaCodigo:
                                type: integer
                              FormaDescricao:
                                type: string
                              FormaEntrada:
                                type: string
                              FormaMeioPagtoNFe:
                                type: string
                              FormaIntegracaoCartao:
                                type: string
                              FormaTipoTransacaoTEF:
                                type: string
                  ConfiguracoesTEF:
                    type: object
                    properties:
                      TEFempresaAutomacao:
                        type: string
                      TEFcapAutomacao:
                        type: integer
                      TEFversaoInterface:
                        type: integer
                      TEFnomeAutomacao:
                        type: string
                      TEFversaoAutomacao:
                        type: string
                      TEFregistroCertificacao:
                        type: string
                      TEFVersaoImpressao:
                        type: integer
                  ConfiguracoesPIX:
                    type: object
                    properties:
                      UtilizaCentriumPAG:
                        type: string
                      MinimoPix:
                        type: number
                      TempoEspera:
                        type: integer
                      UtilizaEncurtador:
                        type: string
                      
  /ApiCentriumOAuth/GetCliente:
    get:
      summary: Buscar cliente por CPF
      description: Retorna os dados detalhados de um único cliente cadastrado no sistema.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: Token de acesso no formato OAuth.
          schema:
            type: string
            example: "OAuth seu_token_de_acesso"
        - name: Content-Type
          in: header
          required: true
          description: Tipo de conteúdo da requisição.
          schema:
            type: string
            example: "application/json"
        - name: Empresa
          in: header
          required: true
          description: Código da empresa.
          schema:
            type: integer
            example: 1
        - name: CPFCNPJ
          in: query
          required: true
          description: Identificador exclusivo do cliente.
          schema:
            type: string
            example: "12345678900"       

      responses:
        '200':
          description: Cliente localizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  CodCliente:
                    type: integer
                  nome:
                    type: string
                  cpf:
                    type: string
                  email:
                    type: string  
                  celular:
                    type: string 
                  cep:
                    type: string
                  endereco:
                    type: string
                  bairro:
                    type: string
                  numero:
                    type: string
                  cidade:
                    type: string
                  uf:
                    type: string  
                  LimiteCredito:
                    type: number
                  PermiteVendaCredito:
                    type: boolean
                  CodigoConvenio:
                    type: integer
                  NomeConvenio:
                    type: string
                  DescontoConvenio:
                    type: number

  /ApiCentriumOAuth/PostCliente:
